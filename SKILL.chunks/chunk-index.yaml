## Chunk 分段加载约定

Chunk 07 / 08 / 09 / 03 / 04 / 05 的节标题都用 `§节名` 标记，主控按节加载，避免整章12KB全部塞入上下文：
- Chunk 07: §L0, §L1, §L2, §L3, §L4, §L5, §自主裁决
- Chunk 08: Step1~Step7, §Snake审阅
- Chunk 04: §AUTO_REVIEW(自主裁决速查·详见Chunk07), §RESOLVE, §WRITE, §REFINE, §REFERENCE_CHECK, §INTEGRATE
- Chunk 05: §AUDIT(10维度), §TODO, §JUDGE

> 上下文预算紧张时的卸载顺序（从先到后）：
> Chunk 02 → 03 → 09 → 07过期节 → 08（GRAPH跑完后可卸） → 04（到AUDIT可卸）→ 只保留 01+06

